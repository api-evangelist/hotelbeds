    type: OpenAPI
  - url: collections/hotelbeds.postman_collection.json
    type: PostmanCollection
  - url: collections/hotelbeds.opencollection.json
    type: OpenCollection
  description: All static information needed to operate the Booking API - hotels,
    countries, destinations, accommodations, boards, categories, chains, facilities,
    segments, and currencies - served over fast REST GET endpoints.
- aid: hotelbeds:cache-rates-api
  name: Cache Rates API
  tags:
  - Hotels
