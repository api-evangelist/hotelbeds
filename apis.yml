    type: OpenAPI
  - url: collections/hotelbeds.postman_collection.json
    type: PostmanCollection
  - url: collections/hotelbeds.opencollection.json
    type: OpenCollection
  description: Bulk cached price and availability snapshots for high-volume search,
    letting integrators index inventory locally and reduce live availability calls
    before rechecking up-to-date rates through the Booking API.
