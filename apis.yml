aid: hotelbeds
url: https://raw.githubusercontent.com/api-evangelist/hotelbeds/refs/heads/main/apis.yml
name: Hotelbeds
kind: company
description: Hotelbeds (now part of HBX Group) is a global B2B travel bedbank and
  accommodation wholesaler. Its APItude suite of REST APIs lets travel sellers search,
  price, and book hotels, activities, and transfers, and pull static content and
  cached availability, authenticated with an Api-key plus a SHA256 X-Signature of
  the API key, secret, and request timestamp.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Travel
- Hotels
- Bedbank
- Accommodation
- Booking
created: '2026-06-25'
modified: '2026-06-25'
specificationVersion: '0.19'
apis:
- aid: hotelbeds:hotel-booking-api
  name: Hotel Booking API
  tags:
  - Hotels
  - Booking
  - Availability
  - Rates
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.hotelbeds.com/documentation/hotels/booking-api/
  baseURL: https://api.hotelbeds.com/hotel-api/1.0
  properties:
  - url: https://developer.hotelbeds.com/documentation/hotels/booking-api/
    type: Documentation
  - url: https://developer.hotelbeds.com/documentation/hotels/booking-api/workflow/
    type: APIReference
  - url: openapi/hotelbeds-openapi.yml
    type: OpenAPI
  - url: collections/hotelbeds.postman_collection.json
    type: PostmanCollection
  - url: collections/hotelbeds.opencollection.json
    type: OpenCollection
  description: Hotel availability search, real-time rate checking (checkrates), and
    the full booking lifecycle - confirm, list, detail, modify, and cancel
    reservations - across the Hotelbeds accommodation bedbank.
- aid: hotelbeds:hotel-content-api
  name: Hotel Content API
  tags:
  - Hotels
