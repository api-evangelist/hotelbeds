meters:
- name: confirmed_bookings
  description: Bookings confirmed through the Booking API, charged at the net wholesale rate.
  unit: bookings
  aggregation: sum
  dimensions:
  - account
  - api
  - destination
- name: booking_net_amount
  description: Net wholesale amount payable per confirmed booking under the partner agreement.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - currency
- name: cancellation_penalties
  description: Penalty amounts incurred on cancellations inside the cancellation policy window.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - currency
- name: availability_requests
  description: Availability and checkrate calls made against per-key quotas (cost driver as throughput, not direct billing).
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
principles:
- name: Visibility
  description: Reconcile confirmed bookings against partner settlement statements; track net amounts by destination and currency.
- name: Allocation
  description: Tag API keys per brand/channel and map confirmed bookings to internal cost centers and margins.
- name: Optimization
  description: Cache static data via the Content API and use the Cache API for bulk pricing to cut availability traffic; manage cancellation windows to limit penalty exposure.
- name: Accountability
  description: Assign owners per channel; review booking volume, margin, and cancellation penalties monthly against targets.
