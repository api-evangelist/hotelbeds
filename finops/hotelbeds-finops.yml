description: >-
  FinOps view of Hotelbeds (HBX Group) APItude. Unlike usage-metered API
  platforms, Hotelbeds does not bill per API call. Cost is the net wholesale rate
  charged when a booking is confirmed; the seller's economics are the margin
  between that net rate and the resale price, settled under the partner
  agreement. The FinOps focus is therefore on booking-level cost allocation,
  cancellation/penalty exposure, and minimizing wasted availability traffic
  rather than on token or request billing.
notes: >-
  No public usage-based rate card exists; net rates, margins, penalties, and
  settlement terms are contractual and partner-specific. Values are not
  reconciled.
sources:
- https://developer.hotelbeds.com/documentation/getting-started/
- https://www.hbxgroup.com/products-and-services/api-suite
